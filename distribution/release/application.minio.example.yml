mfs:
  reception:
    enabled: ${MFS_RECEPTION_ENABLED:false}
    bucket: ${MFS_RECEPTION_BUCKET:muyun-recording}
    service-token: ${MFS_RECEPTION_TOKEN:}
  storage:
    type: s3
    temp-dir: ${user.dir}/var/tmp
    s3:
      endpoint: ${MFS_S3_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${MFS_S3_ACCESS_KEY}
      secret-key: ${MFS_S3_SECRET_KEY}
      bucket: ${MFS_S3_BUCKET:muyun-files}
      auto-create-bucket: false
  database:
    path: ${user.dir}/var/data/muyun-fileserver.db
  viewer:
    enabled: true
    text:
      max-inline-bytes: 1048576
    pdf-rendering:
      enabled: true
      office-enabled: true
      renderer: libreoffice
      libreoffice:
        command: soffice
        timeout: 60S
        max-concurrency: 1
        retry-failure-after: 5M
        profile-root: ${user.dir}/var/tmp/libreoffice-profile
      artifact-cache:
        cleanup-orphan-on-file-delete: true
