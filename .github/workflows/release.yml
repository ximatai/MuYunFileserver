name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/viewer/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install media verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify media worker failure recovery
        run: |
          python3 -m unittest discover -s scripts -p 'test_release*.py' -v
          python3 -m unittest discover -s workers/media-worker -p 'test*.py' -v

      - name: Build application
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew clean build --no-daemon

      - name: Assemble release bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/package_release.py --version "$APP_VERSION"
          python3 scripts/verify_release_runtime.py "dist/MuYunFileServer-$APP_VERSION"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
