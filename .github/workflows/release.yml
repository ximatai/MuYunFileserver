name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/viewer/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install media verification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify media worker failure recovery
        run: python3 -m unittest discover -s workers/media-worker -p test_worker.py -v

      - name: Build application
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew clean build --no-daemon

      - name: Assemble release bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP_NAME=MuYunFileServer
          VERSION="$APP_VERSION"
          RELEASE_DIR="dist/${APP_NAME}-${VERSION}"
          mkdir -p "${RELEASE_DIR}"
          cp -R build/quarkus-app "${RELEASE_DIR}/quarkus-app"
          cp src/main/resources/application.yml "${RELEASE_DIR}/application.yml"
          cp distribution/release/application.local.example.yml "${RELEASE_DIR}/application.local.example.yml"
          cp distribution/release/application.minio.example.yml "${RELEASE_DIR}/application.minio.example.yml"
          cp distribution/release/application.seaweedfs.example.yml "${RELEASE_DIR}/application.seaweedfs.example.yml"
          cp compose.yaml "${RELEASE_DIR}/compose.yaml"
          cp compose.seaweedfs.yaml "${RELEASE_DIR}/compose.seaweedfs.yaml"
          mkdir -p "${RELEASE_DIR}/docs/design"
          cp docs/design/seaweed-storage.md "${RELEASE_DIR}/docs/design/seaweed-storage.md"
          mkdir -p "${RELEASE_DIR}/workers" "${RELEASE_DIR}/scripts"
          mkdir -p "${RELEASE_DIR}/workers/media-worker"
          cp workers/media-worker/worker.py workers/media-worker/README.md "${RELEASE_DIR}/workers/media-worker/"
          cp scripts/render-seaweed-identities.py "${RELEASE_DIR}/scripts/render-seaweed-identities.py"
          cp README.md "${RELEASE_DIR}/README.md"
          cp distribution/release/RUN.md "${RELEASE_DIR}/RUN.md"
          (
            cd dist
            zip -r "${APP_NAME}-${VERSION}.zip" "${APP_NAME}-${VERSION}"
            tar -czf "${APP_NAME}-${VERSION}.tar.gz" "${APP_NAME}-${VERSION}"
            shasum -a 256 "${APP_NAME}-${VERSION}.zip" "${APP_NAME}-${VERSION}.tar.gz" > "${APP_NAME}-${VERSION}.sha256"
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/MuYunFileServer-${{ steps.version.outputs.version }}.zip
            dist/MuYunFileServer-${{ steps.version.outputs.version }}.tar.gz
            dist/MuYunFileServer-${{ steps.version.outputs.version }}.sha256
