name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MFS_TEST_MINIO_IMAGE: muyun-test-minio:ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/viewer/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MinIO test server from pinned source
        run: docker build --tag "$MFS_TEST_MINIO_IMAGE" src/test/resources/minio

      - name: Run tests
        # The integration test invokes the same native decoder as the media Worker.
        # Install it explicitly instead of relying on the hosted runner image.
        # Python media regressions must run as part of the PR gate as well.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m unittest discover -s scripts -p 'test_release*.py' -v
          python3 -m unittest discover -s workers/media-worker -p 'test*.py' -v
          ./gradlew test --no-daemon

      - name: Build application
        run: ./gradlew build --no-daemon
