# Local compatibility baseline. HTTPS, restricted recording credentials and
# backup/restore must be configured before exposing an endpoint to Agora.
services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["mini", "-dir=/data", "-admin.ui=false", "-webdav=false", "-s3.port.iceberg=0", "-s3.port.lance=0", "-s3.config=/etc/seaweedfs/s3.json"]
    restart: unless-stopped
    environment:
      S3_BUCKET: ${MFS_S3_BUCKET:-muyun-files},${MFS_RECEPTION_BUCKET:-muyun-recording}
    ports:
      - "127.0.0.1:${MFS_S3_PORT:-8333}:8333"
    volumes:
      - seaweed-data:/data
      - ${MFS_S3_IDENTITIES_FILE:-./var/seaweedfs/s3.json}:/etc/seaweedfs/s3.json:ro
    stop_grace_period: 30s
volumes:
  seaweed-data:
